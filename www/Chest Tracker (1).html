<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chest Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rajdhani:wght@500;600;700&family=Russo+One&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d1a;--surface:#151833;--surface2:#1d2145;--line:#2b3066;--text:#eef0ff;--muted:#9aa0cf;--blue:#3fa9ff;--purple:#8b5cf6;--yellow:#ffd23f;--danger:#ff5d73;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:radial-gradient(circle at 15% -10%,#262a6b 0,transparent 45%),var(--bg);color:var(--text);font-family:"Rajdhani","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;font-weight:600;position:relative}
#app{min-height:100%;max-width:520px;margin:0 auto;padding:10px 12px 12px;display:flex;flex-direction:column;gap:10px}
button{font:inherit;color:var(--text);cursor:pointer;border:1px solid var(--line);background:var(--surface2);border-radius:12px;font-weight:700;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button:active{filter:brightness(1.35)}
.top{display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font-family:"Bungee","Impact",sans-serif;font-size:1.3rem;font-weight:400;letter-spacing:.05em;background:linear-gradient(100deg,var(--blue),var(--purple) 35%,var(--yellow) 50%,var(--purple) 65%,var(--blue));background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}
.who{color:var(--muted);font-size:.85rem}.who b{color:var(--yellow)}
.small{padding:7px 11px;font-size:.8rem;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}
.stat span{display:block;color:var(--muted);font-size:.58rem;text-transform:uppercase;letter-spacing:.05em}
.stat b{font-size:1.25rem;color:var(--blue)}
.stat.hl b{color:var(--yellow)}
.goal{display:block;width:100%;text-align:left;padding:9px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.goal .gt{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);margin-bottom:7px}
.goal .gt b{color:var(--text)}
.bar{height:8px;border-radius:99px;background:var(--bg);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--purple));border-radius:99px;transition:width .2s}
.goal.done{border-color:var(--yellow)}.goal.done .bar i{background:var(--yellow)}.goal.done .gt b{color:var(--yellow)}
.now{position:relative;text-align:center;border-top:3px solid var(--purple);background:var(--surface);border-radius:12px;padding:6px 0 2px}
.now small{display:block;color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.08em}
#cur{display:inline-block;font-family:"Russo One","Impact",sans-serif;font-size:clamp(4.5rem,24vw,7.5rem);font-weight:400;line-height:1;color:var(--yellow);text-shadow:0 0 26px rgba(255,210,63,.38)}
#timer{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
#add{flex:1 0 auto;min-height:clamp(210px,36dvh,360px);font-size:clamp(1.8rem,9vw,2.6rem);font-family:"Russo One","Impact",sans-serif;font-weight:400;letter-spacing:.04em;position:relative;overflow:hidden;border:0;border-radius:20px;color:#1a1500;background:linear-gradient(160deg,#ffe066,var(--yellow) 55%,#ffb800);box-shadow:0 6px 0 #a67c00}
#add:active{transform:translateY(4px);box-shadow:0 2px 0 #a67c00;filter:none}
#add::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:sheen 3.6s ease-in-out infinite;pointer-events:none}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);pointer-events:none;width:30px;height:30px}
#floatBox{position:absolute;inset:0;pointer-events:none}
.fl{position:absolute;left:50%;top:38%;font-family:"Russo One",sans-serif;font-size:1.7rem;color:var(--yellow);text-shadow:0 0 12px rgba(255,210,63,.7)}
.cf{position:fixed;top:0;left:0;width:9px;height:14px;border-radius:2px;pointer-events:none;z-index:50}
.stat b{font-family:"Russo One","Rajdhani",sans-serif;font-weight:400}
#fin,#openHist{font-family:"Russo One","Rajdhani",sans-serif;font-weight:400;letter-spacing:.03em}
.bar i{position:relative;overflow:hidden;transition:width .45s cubic-bezier(.2,.8,.2,1)}
.bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);transform:translateX(-100%);animation:barsheen 2.2s linear infinite}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;background:radial-gradient(40% 35% at 20% 25%,rgba(63,169,255,.16),transparent 70%),radial-gradient(40% 35% at 80% 70%,rgba(139,92,246,.18),transparent 70%);animation:drift 18s ease-in-out infinite}
#app>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) backwards}
#app>*:nth-child(2){animation-delay:.06s}#app>*:nth-child(3){animation-delay:.12s}#app>*:nth-child(4){animation-delay:.18s}#app>*:nth-child(5){animation-delay:.24s}#app>*:nth-child(6){animation-delay:.3s}#app>*:nth-child(7){animation-delay:.36s}
#app>.goal.done{animation:glow 1.8s ease-in-out infinite}
.ovl.on{animation:fade .2s backwards}
.ovl.on .box{animation:boxin .3s cubic-bezier(.2,.8,.2,1) backwards}
.item{animation:slidein .32s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*35ms)}
button{transition:transform .08s,filter .15s}
.aux button:active,#fin:active,#openHist:active{transform:scale(.95)}
@keyframes shine{to{background-position:-250% 0}}
@keyframes sheen{0%,55%{left:-60%}100%{left:130%}}
@keyframes barsheen{to{transform:translateX(100%)}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes boxin{from{opacity:0;transform:translateY(18px) scale(.95)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slidein{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
@keyframes drift{0%,100%{transform:translate(-6%,-4%)}50%{transform:translate(6%,5%)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 rgba(255,210,63,0)}50%{box-shadow:0 0 20px rgba(255,210,63,.6)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.aux{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.aux button{padding:14px 0;font-size:1rem}
.foot{display:grid;grid-template-columns:1fr auto;gap:8px}
#fin{padding:16px;font-size:1.05rem;border:0;background:linear-gradient(135deg,#2563eb,var(--purple))}
#openHist{padding:0 18px}
.ovl{position:fixed;inset:0;display:none;z-index:20;padding:16px;background:rgba(5,6,16,.78);align-items:center;justify-content:center}
.ovl.on{display:flex}
#login{background:var(--bg);z-index:30}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;width:100%;max-width:380px}
.box h3{margin:0 0 8px}.box p{margin:0 0 12px;color:var(--muted);font-size:.9rem}
.box input,.box textarea{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);margin-bottom:10px}
.row{display:flex;gap:8px;justify-content:flex-end}.row button{padding:10px 16px}
.go{background:var(--yellow);color:#1a1500;border:0;width:100%;padding:13px}
#lErr{color:var(--danger);min-height:1.2em;font-size:.85rem;margin-bottom:6px}
#hist{align-items:stretch;padding:0;background:var(--bg);z-index:15;padding-top:env(safe-area-inset-top,0px)}
.sheet{width:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;padding:12px;height:100%}
.sheet header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sheet h2{margin:0;font-size:1.1rem}
#list{flex:1;overflow-y:auto}
.item{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.item .n{color:var(--blue);font-weight:900;min-width:40px}
.item .c{flex:1}.item .c b{color:var(--yellow);font-size:1.15rem}
.item .c div{color:var(--muted);font-size:.75rem}
.item button{padding:8px 11px}
.empty{text-align:center;color:var(--muted);padding:30px}
.tools{border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
.tools textarea{height:70px;font-size:.75rem}
.tools .row{justify-content:stretch;flex-wrap:wrap}.tools .row button{flex:1;font-size:.85rem;padding:10px 6px}
.danger{color:var(--danger);border-color:#5a2433}
</style>
</head>
<body>
<div id="app">
  <div class="top"><h1>CHEST TRACKER</h1><div class="who">👤 <b id="who"></b> <button class="small" id="btnOut">Sair</button></div></div>
  <div class="stats">
    <div class="stat"><span>Total acumulado</span><b id="sTotal">0</b></div>
    <div class="stat"><span>Partidas</span><b id="sCount">0</b></div>
    <div class="stat"><span>Média</span><b id="sAvg">0</b></div>
    <div class="stat hl"><span>Baús/hora</span><b id="sRate">—</b></div>
  </div>
  <button class="goal" id="goal"><div class="gt"><span id="gLabel">🎯 Definir meta de baús</span><b id="gPct"></b></div><div class="bar"><i id="gBar"></i></div></button>
  <div class="now"><small id="cTitle">Partida 1</small><div id="cur">0</div><div id="floatBox"></div><div id="timer">00:00</div></div>
  <button id="add">+ ADICIONAR BAÚ</button>
  <div class="aux">
    <button id="m1">−1</button><button id="p5">+5</button><button id="undo">↶ Desfazer</button><button id="zero" class="danger">Zerar</button>
  </div>
  <div class="foot"><button id="fin">✔ FINALIZAR PARTIDA</button><button id="openHist">📜 Histórico</button></div>
</div>

<div id="hist" class="ovl"><div class="sheet">
  <header><h2>📜 Histórico</h2><button class="small" id="closeHist">✕ Fechar</button></header>
  <div id="list"></div>
  <div class="tools">
    <textarea id="bk" placeholder="Backup (JSON): use Exportar para copiar ou cole aqui e toque em Importar"></textarea>
    <div class="row"><button id="exp">Exportar</button><button id="imp">Importar</button><button id="clr" class="danger">Zerar histórico</button></div>
  </div>
</div></div>

<div id="login" class="ovl on"><div class="box"><h3>🎮 Entrar</h3><p>Digite um nome e uma senha. Se o nome não existir, a conta é criada. Os dados ficam salvos neste aparelho.</p><input id="lName" type="text" placeholder="Nome" autocomplete="username"><input id="lPass" type="password" placeholder="Senha (mín. 4 caracteres)" autocomplete="current-password"><div id="lErr"></div><button id="lGo" class="go">Entrar / Criar conta</button></div></div>

<div id="modal" class="ovl"><div class="box"><h3 id="mTitle"></h3><p id="mText"></p><input id="mInput" type="number" min="0" step="1"><div class="row"><button id="mCancel">Cancelar</button><button id="mOk" class="go" style="width:auto">Confirmar</button></div></div></div>

<script>
const OLD_KEY = "fortnite-chest-tracker-v1";
const dataKey = n => "fct-data:" + n;
const $ = id => document.getElementById(id);
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
function pop(el, k = 1.16, d = 170) {
  if (RM || !el.animate) return;
  el.animate([{ transform: "scale(" + k + ")" }, { transform: "scale(1)" }], { duration: d, easing: "cubic-bezier(.2,.8,.2,1)" });
}
function setTxt(id, v) { const el = $(id); if (el.textContent !== String(v)) { el.textContent = v; pop(el, 1.25, 260); } }
function floatText(txt) {
  if (RM) return;
  const box = $("floatBox"); if (box.children.length > 6) return;
  const el = document.createElement("span"); el.className = "fl"; el.textContent = txt;
  el.style.marginLeft = Math.round((Math.random() - .5) * 120) + "px"; box.appendChild(el);
  el.animate([{ transform: "translate(-50%,0) scale(.8)", opacity: 1 }, { transform: "translate(-50%,-80px) scale(1.25)", opacity: 0 }],
    { duration: 650, easing: "ease-out" }).onfinish = () => el.remove();
}
function ripple(btn, e) {
  if (RM) return;
  const r = btn.getBoundingClientRect();
  const x = e && e.clientX ? e.clientX - r.left : r.width / 2, y = e && e.clientY ? e.clientY - r.top : r.height / 2;
  const el = document.createElement("span"); el.className = "rip";
  el.style.left = x - 15 + "px"; el.style.top = y - 15 + "px"; btn.appendChild(el);
  el.animate([{ transform: "scale(0)", opacity: .6 }, { transform: "scale(" + Math.ceil(r.width / 15) + ")", opacity: 0 }],
    { duration: 450, easing: "ease-out" }).onfinish = () => el.remove();
}
function confetti() {
  if (RM) return;
  const cols = ["#ffd23f", "#3fa9ff", "#8b5cf6", "#ff5d73"];
  for (let i = 0; i < 28; i++) {
    const el = document.createElement("i"); el.className = "cf"; el.style.background = cols[i % 4]; document.body.appendChild(el);
    const x = innerWidth / 2, y0 = innerHeight * .3, dx = (Math.random() - .5) * innerWidth * .9, dy = innerHeight * (.35 + Math.random() * .5);
    el.animate([{ transform: "translate(" + x + "px," + y0 + "px) rotate(0deg)", opacity: 1 },
      { transform: "translate(" + (x + dx) + "px," + (y0 + dy) + "px) rotate(" + Math.round(Math.random() * 720 - 360) + "deg)", opacity: 0 }],
      { duration: 1100 + Math.random() * 600, easing: "cubic-bezier(.2,.6,.3,1)" }).onfinish = () => el.remove();
  }
}
let state = { matches: [], current: 0, startedAt: null, goal: 0 };
let user = null, undoStack = [], busy = false, goalHit = null;

function readJSON(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
function rid() { return "m" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function cleanMatches(arr) {
  return (Array.isArray(arr) ? arr : []).filter(m => m && Number.isFinite(m.chests) && m.chests >= 0).map(m => ({
    id: m.id || rid(), chests: Math.floor(m.chests),
    ts: Number.isFinite(m.ts) ? m.ts : Date.now(), dur: Number.isFinite(m.dur) ? m.dur : null }));
}
function clean(p) {
  if (!p || !Array.isArray(p.matches)) return null;
  return { matches: cleanMatches(p.matches),
    current: Number.isFinite(p.current) && p.current > 0 ? Math.floor(p.current) : 0,
    startedAt: Number.isFinite(p.startedAt) ? p.startedAt : null,
    goal: Number.isFinite(p.goal) && p.goal > 0 ? Math.floor(p.goal) : 0 };
}
function save() { if (!user) return; try { localStorage.setItem(dataKey(user), JSON.stringify(state)); } catch (e) {} }
const fmtDate = ts => new Date(ts).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", year: "2-digit", hour: "2-digit", minute: "2-digit" });
function fmtDur(ms) {
  const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  const p = n => String(n).padStart(2, "0");
  return h ? h + ":" + p(m) + ":" + p(x) : p(m) + ":" + p(x);
}
const toInt = v => { const n = Math.floor(Number(v)); return Number.isFinite(n) ? n : NaN; };
function buzz() { try { navigator.vibrate && navigator.vibrate(8); } catch (e) {} }

function fmtRate(c, ms) { return ms >= 30000 ? (c / (ms / 3600000)).toFixed(1).replace(".", ",") : "—"; }
function tick() {
  const el = state.startedAt ? Date.now() - state.startedAt : 0;
  $("timer").textContent = "⏱ " + fmtDur(el) + " · " + (state.startedAt ? fmtRate(state.current, el) : "—") + " baús/h";
}
function renderGoal() {
  const total = state.matches.reduce((s, m) => s + m.chests, 0) + state.current, g = state.goal || 0, b = $("goal");
  if (!g) { goalHit = null; $("gLabel").textContent = "🎯 Definir meta de baús"; $("gPct").textContent = ""; $("gBar").style.width = "0"; b.classList.remove("done"); return; }
  const pct = Math.min(100, Math.floor(total / g * 100)), hit = total >= g;
  if (goalHit === false && hit) confetti();
  goalHit = hit;
  $("gLabel").textContent = "🎯 Meta: " + total + " / " + g;
  $("gPct").textContent = total >= g ? "Atingida! 🎉" : pct + "%";
  $("gBar").style.width = pct + "%"; b.classList.toggle("done", total >= g);
}
$("goal").onclick = async () => {
  const r = await ask({ title: "Meta de baús", text: "Quantos baús você quer alcançar no total? (0 remove a meta)", input: true, value: state.goal || "" });
  const v = toInt(r); if (r === null || !(v >= 0)) return;
  state.goal = v; save(); renderGoal();
};
function renderMain() {
  const total = state.matches.reduce((s, m) => s + m.chests, 0), n = state.matches.length;
  setTxt("sTotal", total);
  setTxt("sCount", n);
  $("sAvg").textContent = n ? (total / n).toFixed(1).replace(".", ",") : "0";
  $("cTitle").textContent = "Partida " + (n + 1) + " · em andamento";
  const timed = state.matches.filter(m => m.dur != null);
  $("sRate").textContent = fmtRate(timed.reduce((a, m) => a + m.chests, 0), timed.reduce((a, m) => a + m.dur, 0));
  $("cur").textContent = state.current;
  tick(); renderGoal();
}
function renderHist() {
  const list = $("list");
  if (!state.matches.length) { list.innerHTML = '<div class="empty">Nenhuma partida registrada ainda.</div>'; return; }
  let acc = 0;
  const rows = state.matches.map((m, i) => { acc += m.chests; return { m, n: i + 1, acc }; }).reverse();
  list.innerHTML = rows.map((r, i) => '<div class="item" style="--i:' + Math.min(i, 10) + '"><div class="n">#' + r.n + '</div><div class="c"><b>' + r.m.chests +
    ' baús</b><div>' + fmtDate(r.m.ts) + (r.m.dur != null ? ' · ⏱ ' + fmtDur(r.m.dur) + ' · ' + fmtRate(r.m.chests, r.m.dur) + '/h' : '') + ' · acum. ' + r.acc +
    '</div></div><button data-edit="' + r.m.id + '">✏️</button><button data-del="' + r.m.id + '">🗑️</button></div>').join("");
}
function render() { renderMain(); renderHist(); }

// Contagem (um único evento click por toque)
function change(fn) {
  undoStack.push({ current: state.current, startedAt: state.startedAt });
  if (undoStack.length > 50) undoStack.shift();
  fn();
  save(); $("cur").textContent = state.current; tick(); renderGoal();
}
function bump(n) {
  change(() => { state.current = Math.max(0, state.current + n); if (n > 0 && !state.startedAt) state.startedAt = Date.now(); });
  buzz(); pop($("cur")); floatText(n > 0 ? "+" + n : "−" + Math.abs(n));
}
$("add").onclick = e => { bump(1); ripple($("add"), e); };
$("p5").onclick = () => bump(5);
$("m1").onclick = () => { if (state.current > 0) bump(-1); };
$("undo").onclick = () => {
  const u = undoStack.pop(); if (!u) return;
  state.current = u.current; state.startedAt = u.startedAt; save(); $("cur").textContent = state.current; tick(); renderGoal();
};
setInterval(tick, 1000);

// Diálogo
let resolver = null;
function ask({ title, text, input = false, value = "" }) {
  return new Promise(res => {
    resolver = res;
    $("mTitle").textContent = title;
    $("mText").textContent = text || ""; $("mText").style.display = text ? "" : "none";
    const inp = $("mInput"); inp.style.display = input ? "" : "none"; inp.value = value;
    $("modal").classList.add("on");
    if (input) { inp.focus(); inp.select(); }
  });
}
function closeModal(r) { $("modal").classList.remove("on"); if (resolver) { const f = resolver; resolver = null; f(r); } }
$("mCancel").onclick = () => closeModal(null);
$("mOk").onclick = () => closeModal($("mInput").style.display === "none" ? true : $("mInput").value);
$("modal").addEventListener("keydown", e => { if (e.key === "Enter") $("mOk").click(); if (e.key === "Escape") $("mCancel").click(); });

$("zero").onclick = async () => {
  if (!state.current && !state.startedAt) return;
  if (!(await ask({ title: "Zerar a partida atual?", text: "A contagem de " + state.current + " baús e o cronômetro serão reiniciados." }))) return;
  change(() => { state.current = 0; state.startedAt = null; });
};
$("fin").onclick = async () => {
  if (busy) return; busy = true;
  try {
    const n = state.matches.length + 1;
    const ok = await ask({ title: "Finalizar partida " + n + "?", text: "Serão salvos " + state.current + " baús no histórico." });
    if (!ok) return;
    state.matches.push({ id: rid(), chests: state.current, ts: Date.now(), dur: state.startedAt ? Date.now() - state.startedAt : null });
    state.current = 0; state.startedAt = null; undoStack = [];
    save(); render();
  } finally { busy = false; }
};

// Histórico
$("openHist").onclick = () => { renderHist(); $("hist").classList.add("on"); };
$("closeHist").onclick = () => $("hist").classList.remove("on");
$("list").addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.edit) {
    const m = state.matches.find(x => x.id === b.dataset.edit); if (!m) return;
    const r = await ask({ title: "Editar partida", text: "Nova quantidade de baús:", input: true, value: m.chests });
    const v = toInt(r); if (r === null || !(v >= 0)) return;
    m.chests = v; save(); render();
  } else if (b.dataset.del) {
    if (!(await ask({ title: "Excluir esta partida?", text: "Os totais serão recalculados." }))) return;
    state.matches = state.matches.filter(x => x.id !== b.dataset.del); save(); render();
  }
});
$("clr").onclick = async () => {
  if (!state.matches.length) return;
  if (!(await ask({ title: "Zerar todo o histórico?", text: "Todas as partidas serão apagadas. Não dá para desfazer." }))) return;
  state.matches = []; save(); render();
};
$("exp").onclick = async () => {
  const t = JSON.stringify({ app: "fortnite-chest-tracker", version: 2, matches: state.matches });
  $("bk").value = t; $("bk").select();
  try { await navigator.clipboard.writeText(t); } catch (e) {}
};
$("imp").onclick = async () => {
  let p; try { p = JSON.parse($("bk").value); } catch (e) { await ask({ title: "JSON inválido", text: "Cole um backup exportado por este app." }); return; }
  const incoming = cleanMatches(Array.isArray(p) ? p : p && p.matches);
  const have = new Set(state.matches.map(m => m.id + "|" + m.ts));
  const add = incoming.filter(m => !have.has(m.id + "|" + m.ts) && !state.matches.some(x => x.ts === m.ts && x.chests === m.chests));
  state.matches = state.matches.concat(add).sort((a, b) => a.ts - b.ts);
  save(); render(); $("bk").value = "";
  await ask({ title: "Importação concluída", text: add.length + " partida(s) adicionada(s)." });
};

// Login local
async function hash(pw, salt) {
  const t = salt + ":" + pw;
  try {
    const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t));
    return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, "0")).join("");
  } catch (e) { let h = 5381; for (const c of t) h = ((h << 5) + h + c.charCodeAt(0)) >>> 0; return "x" + h; }
}
function startSession(id, users) {
  user = id; undoStack = []; goalHit = null;
  state = clean(readJSON(dataKey(id))) || { matches: [], current: 0, startedAt: null, goal: 0 };
  try { localStorage.setItem("fct-session", id); } catch (e) {}
  $("who").textContent = users[id].name;
  $("login").classList.remove("on"); render();
}
async function doLogin() {
  const name = $("lName").value.trim(), pw = $("lPass").value, err = $("lErr");
  err.textContent = "";
  if (name.length < 2 || pw.length < 4) { err.textContent = "Nome (mín. 2) e senha (mín. 4 caracteres)."; return; }
  const id = name.toLowerCase(), users = readJSON("fct-users") || {};
  if (users[id]) {
    if (users[id].hash !== await hash(pw, users[id].salt)) { err.textContent = "Senha incorreta."; return; }
  } else {
    const salt = Math.random().toString(36).slice(2) + Date.now().toString(36), first = Object.keys(users).length === 0;
    users[id] = { name, salt, hash: await hash(pw, salt) };
    try {
      localStorage.setItem("fct-users", JSON.stringify(users));
      const old = readJSON(OLD_KEY);
      if (first && clean(old) && !localStorage.getItem(dataKey(id))) localStorage.setItem(dataKey(id), JSON.stringify(old));
    } catch (e) {}
  }
  $("lPass").value = ""; startSession(id, users);
}
$("lGo").onclick = doLogin;
$("lPass").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
$("lName").addEventListener("keydown", e => { if (e.key === "Enter") $("lPass").focus(); });
$("btnOut").onclick = () => {
  try { localStorage.removeItem("fct-session"); } catch (e) {}
  user = null; state = { matches: [], current: 0, startedAt: null, goal: 0 }; undoStack = []; render();
  $("hist").classList.remove("on"); $("lName").value = ""; $("lPass").value = ""; $("login").classList.add("on");
};
(function boot() {
  const users = readJSON("fct-users") || {};
  let s = null; try { s = localStorage.getItem("fct-session"); } catch (e) {}
  if (s && users[s]) startSession(s, users); else render();
})();
</script>
